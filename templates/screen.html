<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 800px;
    height: 480px;
    background: #fff;
  }
  body {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: sans-serif;
    color: #000;
  }
  .widget-clock {
    text-align: center;
  }
  .clock-time {
    font-size: 160px;
    font-weight: 700;
    line-height: 1;
  }
  .clock-date {
    font-size: 32px;
    margin-top: 16px;
  }
  .widget-battery {
    position: absolute;
    top: 24px;
    right: 36px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .battery-icon {
    position: relative;
    width: 60px;
    height: 28px;
    box-sizing: border-box;
    border: 3px solid #000;
    border-radius: 3px;
    padding: 2px;
  }
  .battery-icon::after {
    content: "";
    position: absolute;
    top: 8px;
    right: -7px;
    width: 5px;
    height: 12px;
    background: #000;
    border-radius: 0 2px 2px 0;
  }
  .battery-fill {
    height: 100%;
    background: #000;
  }
  .battery-label {
    font-size: 22px;
  }
</style>
</head>
<body>
  {% include "widgets/battery.html" %}
  {% include "widgets/clock.html" %}
</body>
</html>
