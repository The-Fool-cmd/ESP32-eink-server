<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    /* Monospace for anything "technical readout" (header, times, status,
       meter label) — reads as HUD/terminal. Event summaries stay in the
       body sans-serif below since arbitrary-length free text is more
       legible there; mixing the two deliberately, not inconsistently. */
    --mono: "DejaVu Sans Mono", monospace;
  }
  html, body {
    margin: 0;
    padding: 0;
    width: {{ width }}px;
    height: {{ height }}px;
    background: #fff;
  }
  body {
    position: relative;
    font-family: sans-serif;
    color: #000;
  }
  /* Outer HUD frame: two opposing corner brackets, not all four — a full
     viewfinder frame on an 800x480 canvas this busy reads as clutter, two
     corners still reads as "framed" without competing with the content. */
  body::before, body::after {
    content: "";
    position: absolute;
    width: 26px;
    height: 26px;
    border: 3px solid #000;
  }
  body::before { top: 10px; left: 10px; border-right: none; border-bottom: none; }
  body::after { bottom: 10px; right: 10px; border-left: none; border-top: none; }

  .widget-calendar {
    box-sizing: border-box;
    height: 100%;
    padding: 40px 48px;
  }
  .calendar-title {
    font-family: var(--mono);
    font-size: 30px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #fff;
    background: #000;
    /* Bleeds the title bar to the true canvas edge by reversing the
       container's own padding, rather than restructuring the widget's
       HTML to separate a header region from its body. */
    margin: -40px -48px 28px -48px;
    padding: 18px 48px;
  }
  .calendar-events {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .calendar-events li {
    display: flex;
    align-items: baseline;
    gap: 14px;
    margin-bottom: 14px;
    padding: 12px 18px;
    border: 2px solid #000;
    /* Chamfered corner, not rounded — the one card-shape signature that
       reads as "console panel" rather than "friendly app card". */
    clip-path: polygon(14px 0, 100% 0, 100% 100%, 0 100%, 0 14px);
  }
  .event-marker {
    font-family: var(--mono);
    width: 18px;
    flex-shrink: 0;
    font-size: 18px;
  }
  .event-time {
    font-family: var(--mono);
    flex-shrink: 0;
    width: 130px;
    font-size: 20px;
    font-weight: 700;
  }
  .event-summary {
    font-size: 26px;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  /* The one event to look at right now (in progress, or next up) — inverse
     video, the one piece of emphasis on this device rather than decorating
     every row equally. See widgets/calendar.py's "current" flag. */
  .calendar-events li.current {
    background: #000;
    border-color: #000;
  }
  .calendar-events li.current .event-marker,
  .calendar-events li.current .event-time,
  .calendar-events li.current .event-summary {
    color: #fff;
  }
  .calendar-empty, .calendar-error {
    font-family: var(--mono);
    font-size: 24px;
    letter-spacing: 1px;
    color: #000;
  }

  /* Lives inside the header bar's own black band (confined to its ~71px
     height), not floating over the content below — colors are inverted
     (white on black) to read there, rather than pushing it below the
     header where it would collide with the first calendar row instead. */
  .widget-battery {
    position: absolute;
    top: 18px;
    right: 40px;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 5px;
  }
  .battery-meter {
    display: flex;
    gap: 3px;
  }
  .battery-segment {
    width: 14px;
    height: 24px;
    box-sizing: border-box;
    border: 2px solid #fff;
    background: transparent;
  }
  .battery-segment.filled {
    background: #fff;
  }
  .battery-label {
    font-family: var(--mono);
    font-size: 14px;
    letter-spacing: 1px;
    color: #fff;
  }
  .widget-battery.level-low .battery-segment {
    border-width: 3px;
  }
  .widget-battery.level-low .battery-segment.filled {
    /* Black hatch on white would vanish against the header's own black —
       stripe with transparent (shows the header black through it) instead. */
    background: repeating-linear-gradient(
      45deg,
      transparent,
      transparent 2px,
      #fff 2px,
      #fff 4px
    );
  }
  .widget-battery.level-low .battery-label {
    font-weight: 700;
  }

  .updated-at {
    position: absolute;
    bottom: 40px;
    right: 16px;
    font-family: var(--mono);
    font-size: 14px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #000;
  }
</style>
</head>
<body>
  {% include "widgets/battery.html" %}
  {% include "widgets/calendar.html" %}
  {% if updated_at %}
  <div class="updated-at">Updated {{ updated_at }}</div>
  {% endif %}
</body>
</html>
