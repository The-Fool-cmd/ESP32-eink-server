<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: {{ width }}px;
    height: {{ height }}px;
    background: #fff;
  }
  body {
    position: relative;
    font-family: sans-serif;
    color: #000;
  }

  .widget-calendar {
    box-sizing: border-box;
    height: 100%;
    padding: 40px 48px;
  }
  .calendar-title {
    font-size: 40px;
    font-weight: 700;
    margin-bottom: 24px;
  }
  .calendar-events {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .calendar-events li {
    display: flex;
    align-items: baseline;
    gap: 20px;
    margin-bottom: 16px;
    padding: 12px 16px;
    border: 2px solid #000;
    border-radius: 6px;
  }
  .event-time {
    flex-shrink: 0;
    width: 140px;
    font-size: 22px;
    font-weight: 700;
  }
  .event-summary {
    font-size: 26px;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  .calendar-empty, .calendar-error {
    font-size: 26px;
    color: #444;
  }

  .widget-battery {
    position: absolute;
    top: 24px;
    right: 36px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .battery-icon {
    position: relative;
    width: 60px;
    height: 28px;
    box-sizing: border-box;
    border: 3px solid #000;
    border-radius: 3px;
    padding: 2px;
  }
  .battery-icon::after {
    content: "";
    position: absolute;
    top: 8px;
    right: -7px;
    width: 5px;
    height: 12px;
    background: #000;
    border-radius: 0 2px 2px 0;
  }
  .battery-fill {
    height: 100%;
    background: #000;
  }
  .battery-fill.low {
    background: repeating-linear-gradient(
      45deg,
      #000,
      #000 3px,
      #fff 3px,
      #fff 6px
    );
  }
  .battery-label {
    font-size: 22px;
  }
  .battery-label.low {
    font-weight: 700;
  }
  .widget-battery.low .battery-icon {
    border-width: 4px;
  }
</style>
</head>
<body>
  {% include "widgets/battery.html" %}
  {% include "widgets/calendar.html" %}
</body>
</html>
