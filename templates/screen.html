<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    /* Monospace for anything that reads as a technical readout: header,
       times, status, meter label. Event summaries stay in the body
       sans-serif, which is more legible for arbitrary-length free text. */
    --mono: "DejaVu Sans Mono", monospace;
  }
  html, body {
    margin: 0;
    padding: 0;
    width: {{ width }}px;
    height: {{ height }}px;
    background: #fff;
  }
  body {
    position: relative;
    font-family: sans-serif;
    color: #000;
  }
  /* Two opposing corner brackets rather than all four: a full frame on a
     canvas this busy competes with the content. */
  body::before, body::after {
    content: "";
    position: absolute;
    width: 26px;
    height: 26px;
    border: 3px solid #000;
  }
  body::before { top: 10px; left: 10px; border-right: none; border-bottom: none; }
  body::after { bottom: 10px; right: 10px; border-left: none; border-top: none; }

  .widget-calendar {
    box-sizing: border-box;
    height: 100%;
    padding: 40px 48px;
  }
  .calendar-title {
    font-family: var(--mono);
    font-size: 30px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #fff;
    background: #000;
    /* Bleeds the title bar to the canvas edge by reversing the container's
       own padding, so the widget's HTML doesn't need a separate header
       region. */
    margin: -40px -48px 28px -48px;
    padding: 18px 48px;
  }
  .calendar-events {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .calendar-events li {
    display: flex;
    align-items: baseline;
    gap: 14px;
    margin-bottom: 14px;
    padding: 12px 18px;
    border: 2px solid #000;
    /* Chamfered rather than rounded corner: the shared card signature
       across every device template. */
    clip-path: polygon(14px 0, 100% 0, 100% 100%, 0 100%, 0 14px);
  }
  .event-marker {
    font-family: var(--mono);
    width: 18px;
    flex-shrink: 0;
    font-size: 18px;
  }
  .event-time {
    font-family: var(--mono);
    flex-shrink: 0;
    width: 130px;
    font-size: 20px;
    font-weight: 700;
  }
  .event-summary {
    font-size: 26px;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  /* The event in progress or next up, in inverse video — the only
     emphasis on this device. See widgets/calendar.py's "current" flag. */
  .calendar-events li.current {
    background: #000;
    border-color: #000;
  }
  .calendar-events li.current .event-marker,
  .calendar-events li.current .event-time,
  .calendar-events li.current .event-summary {
    color: #fff;
  }
  .calendar-empty, .calendar-error {
    font-family: var(--mono);
    font-size: 24px;
    letter-spacing: 1px;
    color: #000;
  }

  /* Sits inside the header bar's black band (its ~71px height), so the
     colors are inverted to read there. Below the header it would collide
     with the first calendar row. */
  .widget-battery {
    position: absolute;
    top: 18px;
    right: 40px;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 5px;
  }
  .battery-meter {
    display: flex;
    gap: 3px;
  }
  .battery-segment {
    width: 14px;
    height: 24px;
    box-sizing: border-box;
    border: 2px solid #fff;
    background: transparent;
  }
  .battery-segment.filled {
    background: #fff;
  }
  .battery-label {
    font-family: var(--mono);
    font-size: 14px;
    letter-spacing: 1px;
    color: #fff;
  }
  .widget-battery.level-low .battery-segment {
    border-width: 3px;
  }
  .widget-battery.level-low .battery-segment.filled {
    /* A black hatch would vanish against the header's own black, so the
       stripe is transparent and lets the header show through. */
    background: repeating-linear-gradient(
      45deg,
      transparent,
      transparent 2px,
      #fff 2px,
      #fff 4px
    );
  }
  .widget-battery.level-low .battery-label {
    font-weight: 700;
  }

  .updated-at {
    position: absolute;
    bottom: 40px;
    right: 16px;
    font-family: var(--mono);
    font-size: 14px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #000;
  }
</style>
</head>
<body>
  {% include "widgets/battery.html" %}
  {% include "widgets/calendar.html" %}
  {% if updated_at %}
  <div class="updated-at">Updated {{ updated_at }}</div>
  {% endif %}
</body>
</html>
