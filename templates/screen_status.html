<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    /* These must equal devices.py's _SPECTRA6 palette exactly rather than
       just being close: an exact match quantizes with zero error and stays
       a flat fill, while a near-miss gets Floyd-Steinberg'd against the
       real palette and speckles with stray flecks. Reserved for status
       meaning only (battery level, service status) — chrome and framing
       stay black/white so a color never impersonates a status. */
    --c-red: #ff0000;
    --c-yellow: #ffff00;
    --c-green: #00ff00;
    --c-blue: #0000ff;
    /* See templates/screen.html's --mono comment — same split here. */
    --mono: "DejaVu Sans Mono", monospace;
  }
  html, body {
    margin: 0;
    padding: 0;
    width: {{ width }}px;
    height: {{ height }}px;
    /* Dark canvas and chrome, but not the tiles (see .uptime-tile below):
       full-black fills cost ink coverage and refresh time on a reflective
       panel, so only the surrounding frame goes dark and the text-dense
       surfaces stay white. Saturated status colors also read better
       against black than against white, yellow especially. */
    background: #000;
  }
  body {
    position: relative;
    font-family: sans-serif;
    color: #fff;
  }
  /* Decorative accent, not a status color — kept off the tiles entirely
     so it is never confused with status-pending's yellow. */
  body::before, body::after {
    content: "";
    position: absolute;
    width: 26px;
    height: 26px;
    border: 3px solid var(--c-yellow);
  }
  body::before { top: 10px; left: 10px; border-right: none; border-bottom: none; }
  body::after { bottom: 10px; right: 10px; border-left: none; border-top: none; }

  .widget-uptime {
    box-sizing: border-box;
    height: 100%;
    padding: 40px 48px;
    display: flex;
    flex-direction: column;
  }
  .uptime-title {
    font-family: var(--mono);
    font-size: 30px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #fff;
    /* No filled bar here: the canvas is already black, so a same-color bar
       would be invisible. An accent underline carries the header weight
       instead. */
    padding-bottom: 14px;
    margin-bottom: 28px;
    border-bottom: 4px solid var(--c-yellow);
  }
  .uptime-grid {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(2, 1fr);
    gap: 20px;
  }
  .uptime-tile {
    /* min-width: 0 overrides the grid item default of min-width: auto —
       without it, a long unbroken name (e.g. "ESPHome Dashboard") forces
       its column past 1fr instead of shrinking, pushing the grid off the
       right edge of the canvas rather than letting text-overflow ellipsis
       (below) kick in. */
    min-width: 0;
    box-sizing: border-box;
    /* Explicit white: tiles stay light panels floating on the dark canvas
       (see the html/body comment above). Their text colors are stated
       explicitly too, since the inherited body color is white here. */
    background: #fff;
    color: #000;
    border: 3px solid #000;
    border-top-width: 8px;
    /* Chamfered rather than rounded corner — see screen.html's matching
       card style; same visual language across every device. */
    clip-path: polygon(14px 0, 100% 0, 100% 100%, 0 100%, 0 14px);
    padding: 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .uptime-dot {
    width: 18px;
    height: 18px;
    background: #999;
    transform: rotate(45deg);
  }
  .uptime-name {
    font-size: 19px;
    font-weight: 600;
    text-align: center;
    max-width: 100%;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  .uptime-status {
    font-family: var(--mono);
    font-size: 14px;
    letter-spacing: 1px;
    color: #000;
  }
  .uptime-pct {
    font-size: 15px;
    /* Plain black rather than a gray tone: SPECTRA6 has no gray, so a gray
       CSS color dithers into red/green/blue confetti instead of a clean
       black/white stipple. De-emphasis comes from font-size here. */
    color: #000;
  }
  .uptime-empty, .uptime-error {
    /* White, not black — unlike .uptime-pct/.uptime-status above, these sit
       directly on the dark canvas, not inside a white tile. */
    font-family: var(--mono);
    font-size: 24px;
    letter-spacing: 1px;
    color: #fff;
  }

  .status-up { border-top-color: var(--c-green); }
  .status-up .uptime-dot { background: var(--c-green); }

  .status-pending { border-top-color: var(--c-yellow); }
  .status-pending .uptime-dot { background: var(--c-yellow); }

  .status-maintenance { border-top-color: var(--c-blue); }
  .status-maintenance .uptime-dot { background: var(--c-blue); }

  .status-unknown { border-top-color: #000; }
  .status-unknown .uptime-dot { background: #000; }

  .status-down {
    border-color: var(--c-red);
    border-width: 4px;
    border-top-width: 8px;
  }
  .status-down .uptime-dot { background: var(--c-red); }
  /* Deliberate exception to keeping text in plain ink: an offline service
     is an alert, and alert text in the alarm color is a legible, standard
     convention. Kept to this one state only. */
  .status-down .uptime-name, .status-down .uptime-status, .status-down .uptime-pct {
    font-weight: 700;
    color: var(--c-red);
  }

  /* Sits in the top margin above the tile grid, on the dark canvas: the
     unfilled track, border and label go white to stay legible there, while
     the segment fills keep their status color. */
  .widget-battery {
    position: absolute;
    top: 18px;
    right: 40px;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 5px;
  }
  .battery-meter {
    display: flex;
    gap: 3px;
  }
  .battery-segment {
    width: 14px;
    height: 24px;
    box-sizing: border-box;
    border: 2px solid #fff;
    background: transparent;
  }
  .battery-segment.filled {
    background: var(--c-green);
  }
  .level-medium .battery-segment.filled {
    background: var(--c-yellow);
  }
  .level-low .battery-segment.filled {
    background: var(--c-red);
  }
  .battery-label {
    font-family: var(--mono);
    font-size: 14px;
    letter-spacing: 1px;
    color: #fff;
  }
  .widget-battery.level-low .battery-segment {
    border-width: 3px;
    border-color: var(--c-red);
  }
  .widget-battery.level-low .battery-label {
    font-weight: 700;
    color: var(--c-red);
  }

  .updated-at {
    position: absolute;
    bottom: 40px;
    right: 16px;
    font-family: var(--mono);
    font-size: 14px;
    letter-spacing: 1px;
    text-transform: uppercase;
    /* White — sits directly on the dark canvas, not inside a tile. */
    color: #fff;
  }
</style>
</head>
<body>
  {% include "widgets/battery.html" %}
  {% include "widgets/uptime.html" %}
  {% if updated_at %}
  <div class="updated-at">Updated {{ updated_at }}</div>
  {% endif %}
</body>
</html>
