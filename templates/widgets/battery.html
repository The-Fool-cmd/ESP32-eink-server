{% if battery_pct is not none %}
<div class="widget-battery level-{{ battery_level }}">
  <div class="battery-meter">
    {% for i in range(5) %}
    <div class="battery-segment{{ ' filled' if i < battery_segments else '' }}"></div>
    {% endfor %}
  </div>
  <div class="battery-label">[ PWR {{ battery_pct }}% ]</div>
</div>
{% endif %}
