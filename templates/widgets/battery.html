{% if battery_pct is not none %}
{% set low = battery_pct < 20 %}
<div class="widget-battery{{ ' low' if low }}">
  <div class="battery-icon">
    <div class="battery-fill{{ ' low' if low }}" style="width: {{ battery_pct }}%;"></div>
  </div>
  <div class="battery-label{{ ' low' if low }}">{{ battery_pct }}%</div>
</div>
{% endif %}
